<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dispeçer Permi & Hukuk Drill | 100 Soru</title>
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Top Header -->
    <header class="app-header">
      <div class="brand">
        <span class="plane-icon">✈️</span>
        <div>
          <h1>DISPATCHER DRILL</h1>
          <p class="subtitle">Semih Saylam REV02 • 100 Soru</p>
        </div>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="btnGridModal" title="Tüm Soruları Gör (Soru Haritası)">
          <span>📋</span>
        </button>
        <button class="icon-btn" id="themeToggleBtn" title="Tema Değiştir (Gece/Gündüz)">
          <span id="themeIcon">☀️</span>
        </button>
        <div class="stats-badge" id="topStatsBadge" title="Skor Paneli">
          <span class="correct-count" id="headerCorrectCount">0</span>
          <span class="divider">/</span>
          <span class="total-seen" id="headerTotalSeen">0</span>
        </div>
      </div>
    </header>

    <!-- Quick Status / Mode Bar (Tümü, Boşlar, Yanlışlar, Doğrular) -->
    <div class="status-mode-bar">
      <button class="status-btn active" data-status-filter="ALL" id="btnFilterAll">
        <span>Tümü</span>
        <span class="count-pill" id="badgeAllCount">100</span>
      </button>
      <button class="status-btn unattempted-btn" data-status-filter="EMPTY" id="btnFilterEmpty">
        <span>Boşlar</span>
        <span class="count-pill" id="badgeEmptyCount">100</span>
      </button>
      <button class="status-btn wrong-btn" data-status-filter="WRONG" id="btnFilterWrong">
        <span>Yanlışlarım</span>
        <span class="count-pill" id="badgeWrongCount">0</span>
      </button>
      <button class="status-btn correct-btn" data-status-filter="CORRECT" id="btnFilterCorrect">
        <span>Doğrular</span>
        <span class="count-pill" id="badgeCorrectCount">0</span>
      </button>
    </div>

    <!-- Category / Filter Bar -->
    <nav class="filter-scroll">
      <button class="filter-pill active" data-category="ALL">Bütün Konular</button>
      <button class="filter-pill" data-category="Trafik Hakları">Trafik Hakları</button>
      <button class="filter-pill" data-category="Permi & Mevzuat">Permi & Süreler</button>
      <button class="filter-pill" data-category="Hukuk & Konvansiyonlar">Konvansiyonlar</button>
      <button class="filter-pill" data-category="Otoriteler & Kurumlar">Otoriteler</button>
      <button class="filter-pill" data-category="Slot & Seviyeler">Slot & Seviye</button>
      <button class="filter-pill" data-category="Terminoloji & Kısaltmalar">Kısaltmalar</button>
    </nav>

    <!-- Progress Bar -->
    <div class="progress-wrap">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
      <div class="progress-label-wrap">
        <div class="q-nav-trigger" id="qNavTrigger" title="Soru Numarasına Tıkla ve Seç">
          <span id="currentQuestionNumber">Soru 1 / 100</span>
          <span class="dropdown-arrow">▼</span>
        </div>
        <span id="progressPercent">0%</span>
      </div>
    </div>

    <!-- Question Card Area -->
    <main class="question-container">
      <div class="card" id="questionCard">
        <div class="card-meta">
          <span class="badge category-badge" id="cardCategory">Kategori</span>
          <span class="badge difficulty-badge" id="cardDifficulty">Zorluk</span>
          <span class="slide-ref" id="cardSlideRef">Slayt Ref</span>
          <button class="retry-q-btn" id="btnRetrySingle" title="Bu Soruyu Tekrar Çöz">🔄 Tekrar Çöz</button>
        </div>

        <div class="question-text" id="questionText">
          Soru yükleniyor...
        </div>

        <div class="options-grid" id="optionsGrid">
          <!-- Options injected via JS -->
        </div>

        <!-- Explanation Drawer (Hidden until answered) -->
        <div class="explanation-box" id="explanationBox">
          <div class="explanation-header">
            <span id="statusIcon">✅</span>
            <strong id="statusTitle">Doğru!</strong>
          </div>
          <p id="explanationText" class="explanation-body"></p>
        </div>
      </div>
    </main>

    <!-- Bottom Actions Toolbar -->
    <footer class="app-footer">
      <button class="btn btn-secondary" id="btnPrev">← Önceki</button>
      <button class="btn btn-action" id="btnRetryMode" title="Yanlışları Baştan Çöz">🔄 Yanlışları Tekrar Çöz</button>
      <button class="btn btn-random" id="btnRandom" title="Rastgele Soru">🎲</button>
      <button class="btn btn-primary" id="btnNext">Sonraki →</button>
    </footer>

    <!-- Soru Haritası / Grid Modal (Tüm Soruları Görme & İstediğine Zıplama) -->
    <div class="modal-overlay" id="gridModal">
      <div class="modal-content modal-large">
        <div class="modal-header">
          <h3>Soru Haritası (1 - 100)</h3>
          <button class="close-x-btn" id="btnCloseGridModal">✕</button>
        </div>
        <div class="grid-legend">
          <span><span class="legend-dot dot-correct"></span> Doğru</span>
          <span><span class="legend-dot dot-wrong"></span> Yanlış</span>
          <span><span class="legend-dot dot-empty"></span> Boş</span>
          <span><span class="legend-dot dot-current"></span> Aktif</span>
        </div>
        <div class="question-grid-container" id="questionGridContainer">
          <!-- 100 buttons injected here -->
        </div>
      </div>
    </div>

    <!-- Skor Paneli Modal -->
    <div class="modal-overlay" id="scoreModal">
      <div class="modal-content">
        <h2>Uçuş Harekât Özeti</h2>
        <div class="score-grid">
          <div class="score-card correct-card">
            <div class="score-num" id="modalCorrect">0</div>
            <div class="score-txt">Doğru</div>
          </div>
          <div class="score-card wrong-card">
            <div class="score-num" id="modalWrong">0</div>
            <div class="score-txt">Yanlış</div>
          </div>
          <div class="score-card total-card">
            <div class="score-num" id="modalPercent">%0</div>
            <div class="score-txt">Başarı Oranı</div>
          </div>
        </div>
        <p class="score-msg" id="scoreMotivationalMsg">Pratik yapmaya devam!</p>
        <div class="modal-actions">
          <button class="btn btn-danger" id="btnResetProgress">İlerlemeyi Sıfırla</button>
          <button class="btn btn-primary" id="btnCloseScoreModal">Kapat</button>
        </div>
      </div>
    </div>
  </div>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
