<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>500 Slayt Sınav Hazırlık</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --gold: #f59e0b;
      --gold-bg: rgba(245, 158, 11, 0.15);
      --correct: #10b981;
      --correct-bg: rgba(16, 185, 129, 0.15);
      --wrong: #ef4444;
      --wrong-bg: rgba(239, 68, 68, 0.15);
      --header-bg: rgba(9, 13, 22, 0.95);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding-bottom: 80px;
      line-height: 1.5;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--header-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-title {
      font-size: 16px;
      font-weight: 800;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .block-select-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .tabs-bar {
      display: flex;
      gap: 6px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 10px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
    }
    .tab-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }
    .tab-badge {
      display: inline-block;
      background: #ef4444;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 10px;
      margin-left: 4px;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 4px;
      background: #1e293b;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: #38bdf8;
      transition: width 0.2s ease;
    }
    main {
      padding: 12px;
      max-width: 650px;
      margin: 0 auto;
    }
    .q-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 700;
    }
    .slide-tag {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 2px 8px;
      border-radius: 6px;
    }
    .q-index-tag {
      color: #94a3b8;
    }
    .q-text {
      font-size: 15px;
      font-weight: 600;
      color: #f8fafc;
      margin-bottom: 12px;
    }
    .opts-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .opt-btn {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      background: #0d1527;
      border: 1.5px solid #1e293b;
      border-radius: 10px;
      color: #f1f5f9;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .opt-btn:active {
      transform: scale(0.99);
    }
    .opt-letter {
      background: #1e293b;
      color: #94a3b8;
      min-width: 24px;
      height: 24px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
    }
    .opt-text {
      flex: 1;
    }
    /* States */
    .opt-btn.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: #a7f3d0;
    }
    .opt-btn.correct .opt-letter {
      background: var(--correct);
      color: #064e3b;
    }
    .opt-btn.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: #fca5a5;
    }
    .opt-btn.wrong .opt-letter {
      background: var(--wrong);
      color: #450a0a;
    }
    .exp-box {
      margin-top: 10px;
      padding: 10px 12px;
      background: rgba(56, 189, 248, 0.08);
      border-left: 3px solid #38bdf8;
      border-radius: 4px;
      font-size: 13px;
      color: #cbd5e1;
    }
    .exp-box strong {
      color: #38bdf8;
    }
    /* Block Picker Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal-content {
      background: #131b2e;
      border: 1px solid #334155;
      border-radius: 14px;
      width: 100%;
      max-width: 450px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 16px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .modal-header h3 {
      font-size: 16px;
      font-weight: 800;
      color: #f8fafc;
    }
    .modal-close {
      background: #1e293b;
      color: #94a3b8;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }
    .blocks-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .block-grid-item {
      padding: 12px 6px;
      background: #0d1527;
      border: 1px solid #1e293b;
      border-radius: 10px;
      text-align: center;
      color: #f8fafc;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .block-grid-item.active {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
    }
    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: #94a3b8;
    }
    .empty-state h3 {
      font-size: 18px;
      color: #f8fafc;
      margin-bottom: 6px;
    }
    .footer-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      margin-bottom: 24px;
    }
    .btn-action {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-action.next {
      background: #0284c7;
      color: #fff;
    }
    .btn-action.clear {
      background: #ef4444;
      color: #fff;
    }
  </style>
</head>
<body>

  <header>
    <div class="top-row">
      <div class="brand-title">✈️ 500 Slayt Soru Havuzu</div>
      <button class="block-select-btn" id="btnOpenBlocks">Blok 1 / 20 ▾</button>
    </div>
    <div class="tabs-bar">
      <button class="tab-btn active" id="tabBlocksBtn">25'lik Bloklar</button>
      <button class="tab-btn" id="tabErrorsBtn">Hata Bankası <span class="tab-badge" id="errorCountBadge" style="display:none;">0</span></button>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-fill" id="blockProgressBar"></div>
    </div>
  </header>

  <main>
    <!-- View 1: 25-Question Block Quiz View -->
    <div id="blockView">
      <div id="questionsContainer"></div>
      <div class="footer-actions">
        <button class="btn-action next" id="btnNextBlockBottom">Sonraki Bloğa Geç ➔</button>
      </div>
    </div>

    <!-- View 2: Mistakes Bank View -->
    <div id="errorView" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <span style="font-size: 14px; font-weight: 700; color: #94a3b8;" id="errorBankHeading">Kayıtlı Hatalar</span>
        <button class="btn-action clear" style="flex: none; padding: 6px 12px; font-size: 12px;" id="btnClearAllErrors">Hataları Sıfırla</button>
      </div>
      <div id="errorQuestionsContainer"></div>
    </div>
  </main>

  <!-- Block Picker Modal -->
  <div class="modal-overlay" id="blockPickerModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Blok Seç (25'er Soru)</h3>
        <button class="modal-close" id="btnCloseBlocks">&times;</button>
      </div>
      <div class="blocks-grid" id="blocksGridContainer"></div>
    </div>
  </div>

  <script>
    // EMBEDDED 496 SLIDE QUESTIONS DATA
    const ALL_QUESTIONS = [{"id": 1, "s": 2, "c": "Performans, Ağırlık & Denge", "q": "V1 hızı için hangi seçenek doğrudur?", "opts": ["V1 hızına ulaşmadan motorda bir problem olursa kalkıştan vazgeçilir.", "V1 hızı V2 hızından düşük olamaz.", "V1 hızı bazen VR hızından yüksek olabilir.", "V1 hızına ulaştıktan sonra motorda bir problem olursa kalkıştan vazgeçilir."], "ans": 0, "exp": "📌 Hafıza Çivisi: Unutma: V1 hızına ulaşmadan motorda bir problem olursa kalkıştan vazgeçilir"}, {"id": 2, "s": 3, "c": "Genel Dispeç Usulleri & Operasyon", "q": "Hangi yükseklikte \"Second climb segment\" tamamlanır?", "opts": ["Havaalanından 35 feet yukarıda.", "Havaalanından 400 feet yukarıda.", "Havaaalanından 1500 feet yukarıda.", "Uçağın tekerlekleri toplandığında."], "ans": 1, "exp": "📌 Hafıza Çivisi: Bu sorunun kilit cevabı -> Havaalanından 400 feet yukarıda"}, {"id": 3, "s": 4, "c": "Performans, Ağırlık & Denge", "q": "Bir havalimanında 3000 metre uzunluğunda bir pist ve pistin her iki tarafından 2000 metre uzunluğunda clearway mevcut. TODA hangi değerden uzun olamaz?", "opts": ["4000 metre", "6000 metre", "4500 metre", "5000 metre"], "ans": 2, "exp": "📌 Hafıza Çivisi: Bu sorunun kilit cevabı -> 4500 metre"}, {"id": 4, "s": 5, "c": "Performans, Ağırlık & Denge", "q": "Take-off sürecinde hızların doğru sırası hangisidir?", "opts": ["VMCG, V1, VR, V2.", "V1, VMCG, VR, V2.", "V1, VR, V2, VMCA.", "V1, VR, VMCG, V2."], "ans": 0, "exp": "📌 Hafıza Çivisi: Bu sorunun kilit cevabı -> VMCG, V1, VR, V2"}, {"id": 5, "s": 6, "c": "Seyrüsefer & Aletli Yaklaşma (ILS/VOR)", "q": "Stopway aşağıdakilerin hangisinde hesaba katılır?", "opts": ["TODA", "TORA", "LDA", "ASDA"], "ans": 3, "exp": "📌 Hafıza Çivisi: Bu sorunun kilit cevabı -> ASDA"}, {"id": 6, "s": 7, "c": "Performans, Ağırlık & Denge", "q": "TODA=", "opts": ["Pist uzunluğu artı clearway mesafesinin yarısı", "Pist uzunluğu eksi clearway", "TORA artı clearway", "Celarway hariç, toplam pist uzunluğu."], "ans": 0, "exp": "📌 Hafıza Çivisi: Kilit Cevap -> Pist uzunluğu artı clearway mesafesinin yarısı"}, {"id": 7, "s": 8, "c": "Meteoroloji & Altimetre", "q": "Metar kodunda aşağıdakilerden hangisini sis ile beraber kullanamayız?", "opts": ["MI", "PR", "BC", "BL"], "ans": 3, "exp": "📌 Hafıza Çivisi: Bu sorunun kilit cevabı -> BL"}, {"id": 8, "s": 9, "c": "Seyrüsefer & Aletli Yaklaşma (ILS/VOR)", "q": "“ BECMG 1821 2000 BR BKN004 PROB30 2124 0500 FG VV001 “ raporda görülen “PROB30” ifadesi ne anlama gelmektedir?", "opts": ["%30 olasılık", "30 dk’dan az bir süre içinde değişiklik bekleniyor", "Son 30dk içindeki durum", "Bulut tavanı 3000ft olacak"], "ans": 0, "exp": "📌 Hafıza Çivisi: Bu sorunun kilit cevabı -> %30 olasılık"}, {"id": 9, "s": 10, "c": "Performans, Ağırlık & Denge", "q": "Birçok havalimanında RVR ne zaman rapor edilir?", "opts": ["Meteorolojik görüş 1500 mt altına düştüğü zaman", "Pist görüş mesafesi 2000 mt altına düştüğü zaman", "Pist görüş mesafesi 1500 mt altına düştüğü zaman", "Meteorolojik görüş 2000 mt altına düştüğü zaman"], "ans": 0, "exp": "📌 Hafıza Çivisi: Bu sorunun kilit cevabı -> Meteorolojik görüş 1500 mt altına düştüğü zaman"}, {"id": 10, "s": 11, "c": "Meteoroloji & Altimetre", "q": "MKJP 160430Z 160606 36010KT 9999 FEW025CB BECMG1315 14020G34KT FEW015CB SCT025 PROB30 TEMPO 1720 6000 +SHRA SCT010 BKN015CB BECMG 2301 34010KT FEW025 = Rapora göre ETA 1700 UTC’de beklenen rüzgar nedir?", "opts": ["360 / 10 kt", "340 / 10 kt", "140 / 20 kt gust 34 kt", "140 / 27 kt"], "ans": 2, "exp": "📌 Hafıza Çivisi: Bu sorunun kilit cevabı -> 140 / 20 kt gust 34 kt"}, {"id": 11, "s": 12, "c": "Performans, Ağırlık & Denge", "q": "“ TAF VTBD 271800Z 280024 VRB05KT 1200 BR TEMPO 0002 4000 BECMG 0205 9999 SCT015 BKN100 TEMPO 1118 04010G20KT 5000 TSRA SCT009 BKN014 BKN018CB BECMG 2024 6000 “ verilen TAF raporuna göre ETA 1400 UTC ye göre oluşabilecek minimum görüş kaç mt’dir?", "opts": ["1200 mt", "10 km üstü", "5 km", "6 km"], "ans": 2, "exp": "📌 Hafıza Çivisi: Bu sorunun kilit cevabı -> 5 km"}, {" "0470K", "N0470"], "ans": 3, "exp": "📌 Hafıza Çivisi: Bu sorunun kilit cevabı -> N0470"}, {"id": 481, "s": 489, "c": "Genel Dispeç Usulleri & Operasyon", "q": "Snowtam ‘ ın geçerlilik süresi normal olarak 6 saatlik süreyi kapsayacak ve şartlar değişmese bile süre ... ... ...fazla olamaz.", "opts": ["18 saat", "24 saat", "12 saat", "8 saat"], "ans": 1, "exp": "📌 Hafıza Çivisi: Bu sorunun kilit cevabı -> 24 saat"}, {"id": 482, "s": 490, "c": "Havacılık Hukuku & ICAO Mevzuatı", "q": "ICAO Standart Atmosferinde 10000 FT'deki sıcaklık:", "opts": ["M05", "M35", "M20", "0"], "ans": 0, "exp": "📌 Hafıza Çivisi: Bu sorunun kilit cevabı -> M05"}, {"id": 483, "s": 491, "c": "Seyrüsefer & Aletli Yaklaşma (ILS/VOR)", "q": "Hava durumu açısından atmosferdeki en önemli bileşen aşağıdakilerden hangisidir?", "opts": ["Nitrojen", "Su buharı", "Hidrojen", "Oksijen"], "ans": 1, "exp": "📌 Hafıza Çivisi: Bu sorunun kilit cevabı -> Su buharı"}, {"id": 484, "s": 492, "c": "Seyrüsefer & Aletli Yaklaşma (ILS/VOR)", "q": "Aşağıdakilerden hangisi doğrudur?", "opts": ["QNH daima QFE’ye eşittir", "QNH daima QFE’den yüksektir", "QNH daima QFE’den düşüktür", "QNH, QFE’ye eşit olabilir."], "ans": 3, "exp": "📌 Hafıza Çivisi: Bu sorunun kilit cevabı -> QNH, QFE’ye eşit olabilir"}, {"id": 485, "s": 493, "c": "Genel Dispeç Usulleri & Operasyon", "q": "Adveksiyon…", "opts": ["Havanın çökme olayıdır", "Havanın dikey hareketidir", "Konveksiyon ile aynı hadisedir", "Havanın yatay hareketidir"], "ans": 3, "exp": "📌 Hafıza Çivisi: Bu sorunun kilit cevabı -> Havanın yatay hareketidir"}, {"id": 486, "s": 494, "c": "Genel Dispeç Usulleri & Operasyon", "q": "İşba derecesi;", "opts": ["Hava sıcaklığı ile aynı olamaz", "Daima hava sıcaklığından yüksektir", "Daima hava sıcaklığından düşüktür", "Hava sıcaklığına eşit olabilir"], "ans": 3, "exp": "📌 Hafıza Çivisi: Bu sorunun kilit cevabı -> Hava sıcaklığına eşit olabilir"}, {"id": 487, "s": 495, "c": "Meteoroloji & Altimetre", "q": "Kümülüs bulutları;", "opts": ["Sıca  8 km yarıçap içindeki en yüksek araziden olan yüksekliktir", "Gözlem anındaki gözlem istasyonunun basınç yüksekliğidir", "Deniz seviyesinden olan yüksekliktir"], "ans": 0, "exp": "📌 Hafıza Çivisi: Bu sorunun kilit cevabı -> Hava alanı seviyesinden olan yüksekliktir"}, {"id": 494, "s": 502, "c": "Genel Dispeç Usulleri & Operasyon", "q": "The term used to describe the visual phase of flight after completing an instrument approach, to bring an aircraft into position for landing on a runway which is not suitably located for straight-in approach, is:", "opts": ["Visual approach", "Visual manoeuvring(circling)", "Contact approach", "Aerodrome traffic pattern"], "ans": 1, "exp": "📌 Hafıza Çivisi: Bu sorunun kilit cevabı -> Visual manoeuvring(circling)"}, {"id": 495, "s": 503, "c": "Genel Dispeç Usulleri & Operasyon", "q": "The vertical position of an aircraft at or above the transition level with altimeter setting 1013.2 hPa has to be reported:", "opts": ["as Altitude", "as Height", "According to pilot's choice", "as Flight Level"], "ans": 3, "exp": "📌 Hafıza Çivisi: Bu sorunun kilit cevabı -> as Flight Level"}, {"id": 496, "s": 505, "c": "Seyrüsefer & Aletli Yaklaşma (ILS/VOR)", "q": "VFR uçuşlarda asgari emniyet yükseklikleri :", "opts": ["Şehir üzerinde 500 ft / düz arazi 1000 ft", "Dağlık arazi 1000 ft / düz arazi 500 ft", "Şehir üzerinde 1000 ft / İnsan topluluğu olmayan yerlerde 500 ft", "Tüm sahalarda 1000 ft"], "ans": 2, "exp": "📌 Hafıza Çivisi: Unutma: Şehir üzerinde 1000 ft / İnsan topluluğu olmayan yerlerde 500 ft"}];

    const LETTERS = ['A', 'B', 'C', 'D'];
    let currentBlock = 1;
    const totalBlocks = 20; // 1-19: 25 questions, 20: 21 questions
    let currentTab = 'blocks'; // 'blocks' or 'errors'

    // Load state
    let state = {
      userAnswers: {}, // key: qId -> selected option index
      errorBank: []    // list of qIds
    };

    try {
      const saved = localStorage.getItem('dispec_slayt500_v1');
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed) {
          if (parsed.currentBlock) currentBlock = parsed.currentBlock;
          if (parsed.userAnswers) state.userAnswers = parsed.userAnswers;
          if (Array.isArray(parsed.errorBank)) state.errorBank = parsed.errorBank;
        }
      }
    } catch (e) {}

    function saveState() {
      try {
        localStorage.setItem('dispec_slayt500_v1', JSON.stringify({
          currentBlock: currentBlock,
          userAnswers: state.userAnswers,
          errorBank: state.errorBank
        }));
      } catch (e) {}
      updateBadges();
    }

    function updateBadges() {
      const errCount = state.errorBank.length;
      const badge = document.getElementById('errorCountBadge');
      if (badge) {
        badge.textContent = errCount;
        badge.style.display = errCount > 0 ? 'inline-block' : 'none';
      }
      document.getElementById('btnOpenBlocks').textContent = `Blok ${currentBlock} / ${totalBlocks} ▾`;
      document.getElementById('errorBankHeading').textContent = `Kayıtlı Hatalar (${errCount} Soru)`;

      // Progress bar for current block
      const blockQuestions = getQuestionsOfBlock(currentBlock);
      const answeredInBlock = blockQuestions.filter(q => state.userAnswers[q.id] !== undefined).length;
      const pct = Math.round((answeredInBlock / blockQuestions.length) * 100);
      document.getElementById('blockProgressBar').style.width = pct + '%';
    }

    function getQuestionsOfBlock(bId) {
      const startIdx = (bId - 1) * 25;
      const endIdx = bId * 25;
      return ALL_QUESTIONS.slice(startIdx, endIdx);
    }

    function renderCurrentBlock() {
      const container = document.getElementById('questionsContainer');
      container.innerHTML = '';
      const questions = getQuestionsOfBlock(currentBlock);

      questions.forEach((q, idx) => {
        const card = createQuestionCard(q, idx + 1, questions.length, false);
        container.appendChild(card);
      });

      updateBadges();
      window.scrollTo(0, 0);
    }

    function renderErrorBank() {
      const container = document.getElementById('errorQuestionsContainer');
      container.innerHTML = '';

      if (state.errorBank.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>Tertemiz Cano! 🎉</h3>
            <p>Şu an kayıtlı hiçbir hatan yok. Blok testlerini çözdükçe kaçırdığın sorular burada birikecek.</p>
          </div>
        `;
        return;
      }

      state.errorBank.forEach((qId, idx) => {
        const q = ALL_QUESTIONS.find(item => item.id === qId);
        if (q) {
          const card = createQuestionCard(q, idx + 1, state.errorBank.length, true);
          container.appendChild(card);
        }
      });

      window.scrollTo(0, 0);
    }

    function createQuestionCard(q, num, totalNum, isErrorView) {
      const card = document.createElement('div');
      card.className = 'q-card';
      card.id = 'qcard_' + q.id;

      const userAns = state.userAnswers[q.id];

      card.innerHTML = `
        <div class="q-meta">
          <span class="slide-tag">Slayt ${q.s}</span>
          <span class="q-index-tag">Soru ${num} / ${totalNum}</span>
        </div>
        <div class="q-text">${escapeHtml(q.q)}</div>
        <div class="opts-list" id="opts_${q.id}"></div>
        <div class="exp-box" id="exp_${q.id}" style="${userAns !== undefined ? 'display:block;' : 'display:none;'}">
          <strong>💡 Hafıza Çivisi:</strong> ${escapeHtml(q.exp || 'Doğru şıkkı aklına kazı.')}
        </div>
      `;

      const optsContainer = card.querySelector('#opts_' + q.id);

      q.opts.forEach((optText, oIdx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'opt-btn';

        if (userAns !== undefined) {
          if (oIdx === q.ans) {
            btn.classList.add('correct');
          } else if (oIdx === userAns) {
            btn.classList.add('wrong');
          }
        }

        btn.innerHTML = `
          <span class="opt-letter">${LETTERS[oIdx]}</span>
          <span class="opt-text">${escapeHtml(optText)}</span>
        `;

        btn.onclick = () => {
          handleOptionClick(q, oIdx, card);
        };

        optsContainer.appendChild(btn);
      });

      return card;
    }

    function handleOptionClick(q, selectedIdx, cardEl) {
      state.userAnswers[q.id] = selectedIdx;
      const isCorrect = (selectedIdx === q.ans);

      if (!isCorrect) {
        if (!state.errorBank.includes(q.id)) {
          state.errorBank.push(q.id);
        }
      } else {
        // If correct and in errorBank, remove it
        state.errorBank = state.errorBank.filter(id => id !== q.id);
      }

      saveState();

      // Update button classes in card
      const btns = cardEl.querySelectorAll('.opt-btn');
      btns.forEach((btn, idx) => {
        btn.classList.remove('correct', 'wrong');
        if (idx === q.ans) {
          btn.classList.add('correct');
        } else if (idx === selectedIdx) {
          btn.classList.add('wrong');
        }
      });

      // Show explanation
      const expBox = cardEl.querySelector('#exp_' + q.id);
      if (expBox) expBox.style.display = 'block';

      if (navigator.vibrate) navigator.vibrate(10);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Tab switching
    document.getElementById('tabBlocksBtn').onclick = () => {
      currentTab = 'blocks';
      document.getElementById('tabBlocksBtn').classList.add('active');
      document.getElementById('tabErrorsBtn').classList.remove('active');
      document.getElementById('blockView').style.display = 'block';
      document.getElementById('errorView').style.display = 'none';
      renderCurrentBlock();
    };

    document.getElementById('tabErrorsBtn').onclick = () => {
      currentTab = 'errors';
      document.getElementById('tabErrorsBtn').classList.add('active');
      document.getElementById('tabBlocksBtn').classList.remove('active');
      document.getElementById('blockView').style.display = 'none';
      document.getElementById('errorView').style.display = 'block';
      renderErrorBank();
    };

    // Next Block
    document.getElementById('btnNextBlockBottom').onclick = () => {
      if (currentBlock < totalBlocks) {
        currentBlock++;
        saveState();
        renderCurrentBlock();
      } else {
        alert('Tebrikler cano! Tüm 20 blok tamamlandı! 🏆');
      }
    };

    // Clear Errors
    document.getElementById('btnClearAllErrors').onclick = () => {
      if (confirm('Tüm hata havuzunu sıfırlamak istiyor musun cano?')) {
        state.errorBank = [];
        saveState();
        renderErrorBank();
      }
    };

    // Block Modal
    const modal = document.getElementById('blockPickerModal');
    document.getElementById('btnOpenBlocks').onclick = () => {
      renderBlocksGrid();
      modal.classList.add('open');
    };
    document.getElementById('btnCloseBlocks').onclick = () => {
      modal.classList.remove('open');
    };
    modal.onclick = (e) => {
      if (e.target === modal) modal.classList.remove('open');
    };

    function renderBlocksGrid() {
      const grid = document.getElementById('blocksGridContainer');
      grid.innerHTML = '';
      for (let b = 1; b <= totalBlocks; b++) {
        const item = document.createElement('div');
        item.className = 'block-grid-item' + (b === currentBlock ? ' active' : '');
        item.textContent = 'Blok ' + b;
        item.onclick = () => {
          currentBlock = b;
          saveState();
          modal.classList.remove('open');
          renderCurrentBlock();
        };
        grid.appendChild(item);
      }
    }

    // INITIAL LAUNCH
    renderCurrentBlock();
  </script>
